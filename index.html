<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
 * [INPUT]: 依赖 landing.css 的 liquid-glass 视觉层、BG_VIDEO 背景视频、Geist 字体
 * [OUTPUT]: 对外提供品牌门面页，所有 CTA 跳转至 app.html（完整应用）
 * [POS]: fitness-coach 的默认入口（B 方案），与 app.html 老站并存
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温可乐健身 — 循证科学训练体系</title>
<meta name="description" content="温可乐健身：基于循证文献的个性化训练、饮食与恢复方案生成器。覆盖零基础到进阶，居家与健身房双场景。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<div class="hero-root">

  <!-- 循环背景视频（视频本身提供动效，无额外 keyframes） -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260511_230229_7c9bc431-46cf-489a-948d-e8144d8eb5d4.mp4"></video>
  <div class="bg-shade" aria-hidden="true"></div>

  <!-- 顶部导航 -->
  <nav class="navbar">
    <a class="logo" href="index.html">
      <svg class="icon-infinity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 12c-1.9-2.5-3.8-3.8-5.7-3.8a3.8 3.8 0 0 0 0 7.6c1.9 0 3.8-1.3 5.7-3.8Z"/>
        <path d="M12 12c1.9 2.5 3.8 3.8 5.7 3.8a3.8 3.8 0 0 0 0-7.6c-1.9 0-3.8 1.3-5.7 3.8Z"/>
      </svg>
      <span>温可乐健身</span>
    </a>

    <!-- 桌面导航胶囊 -->
    <div class="nav-pill liquid-glass">
      <a class="nav-link active" href="index.html">首页</a>
      <a class="nav-link" href="app.html#formView">训练方案
        <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </a>
      <a class="nav-link" href="app.html#features">科学体系</a>
      <a class="nav-link" href="app.html#method">关于我们</a>
    </div>

    <!-- 桌面 CTA -->
    <div class="nav-cta">
      <a class="btn-pill liquid-glass" href="app.html#resultView">查看方案</a>
      <a class="btn-pill btn-solid" href="app.html#formView">开始测评</a>
    </div>

    <!-- 移动端菜单开关 -->
    <button class="mobile-toggle liquid-glass" id="menuToggle" aria-label="打开菜单" aria-expanded="false">
      <svg id="iconMenu" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <svg id="iconClose" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="display:none"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </nav>

  <!-- 移动端下拉菜单 -->
  <div class="mobile-menu liquid-glass" id="mobileMenu" hidden>
    <a class="mobile-link" href="index.html">首页</a>
    <a class="mobile-link" href="app.html#formView">训练方案
      <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </a>
    <a class="mobile-link" href="app.html#features">科学体系</a>
    <a class="mobile-link" href="app.html#method">关于我们</a>
    <div class="mobile-cta">
      <a class="btn-pill liquid-glass" href="app.html#resultView">查看方案</a>
      <a class="btn-pill btn-solid" href="app.html#formView">开始测评</a>
    </div>
  </div>

  <!-- Hero 内容（左下） -->
  <div class="hero-content">
    <div class="eyebrow"><span class="eyebrow-dot"></span> EVIDENCE-BASED TRAINING · 循证训练体系</div>
    <h1>练得明白，<br>活得舒展。</h1>
    <p>输入你的身体数据，4 步生成专属的训练、饮食与恢复闭环方案。基于 Schoenfeld、ACSM、ISSN 等循证文献，覆盖零基础到进阶，居家与健身房双场景。</p>
    <div class="hero-buttons">
      <a class="btn-hero btn-solid" href="app.html#formView">开始测评</a>
      <a class="btn-hero liquid-glass" href="app.html#method">了解方法</a>
    </div>
  </div>

  <div class="hero-foot" aria-hidden="true">
    <span>温可乐健身 · WenKele Fitness</span>
    <span>训练 / 饮食 / 恢复</span>
  </div>
</div>

<script>
// [INPUT]: 依赖 #menuToggle / #mobileMenu / #iconMenu / #iconClose
// [OUTPUT]: 移动端菜单开合状态
// [POS]: 门面页唯一交互逻辑，不触碰 app.html
// [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
(function () {
  var toggle = document.getElementById('menuToggle');
  var menu = document.getElementById('mobileMenu');
  var iconMenu = document.getElementById('iconMenu');
  var iconClose = document.getElementById('iconClose');
  toggle.addEventListener('click', function () {
    var open = menu.hasAttribute('hidden');
    if (open) { menu.removeAttribute('hidden'); } else { menu.setAttribute('hidden', ''); }
    toggle.setAttribute('aria-expanded', String(open));
    iconMenu.style.display = open ? 'none' : 'block';
    iconClose.style.display = open ? 'block' : 'none';
  });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { menu.setAttribute('hidden', ''); });
  });
})();
</script>
</body>
</html>
